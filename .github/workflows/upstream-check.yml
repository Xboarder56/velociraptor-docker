name: upstream-check

# Polls Velocidex/velociraptor releases. Velocidex has used both minor release
# tags (v0.76 containing v0.76.5 assets) and full patch tags (v0.77.2), and
# since v0.77.3 publishes most binaries gzipped (*.gz); both are accepted.
# This workflow records each asset's exact API-provided URL, version, and
# checksum so the image build does not have to infer the release layout.
#
# For platforms upstream hasn't published yet at the newest patch, the
# best-newest-patch logic naturally pins that platform to its own most
# recent available patch (no special-case fallback needed).

# Bump PRs are opened with GITHUB_TOKEN, which does not trigger pull_request
# workflows; this workflow therefore dispatches build-publish (dry run) on the
# bump branch itself. Merging the PR triggers release-tag.yml, which tags and
# publishes.

on:
  schedule:
    # Hourly (at :17, away from the top-of-the-hour rush), so a Velocidex
    # release reaches a bump PR within about an hour. Steady-state runs are a
    # few API calls: binaries are only downloaded when their pin changes.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_revision_bump:
        description: "Bump IMAGE_REVISION even if nothing changed"
        type: boolean
        default: false

# One check at a time: an auto-release run can wait on its dry run for a
# while, and the next hourly run must not rewrite the bump branch meanwhile.
concurrency:
  group: upstream-check
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatch the bump build; keep this schedule enabled
  issues: write    # report failures

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: Velocidex/velociraptor
      TRIAGE_REPO: Velocidex/velociraptor-triage-collector
      SIGMA_REPO: Velocidex/velociraptor-sigma-rules
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Order matters only for printing.
      ASSET_KEYS: "LINUX_AMD64 LINUX_ARM64 LINUX_AMD64_MUSL DARWIN_AMD64 DARWIN_ARM64 WINDOWS_EXE WINDOWS_MSI"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve per-asset latest patches and sha256s
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          # Per-platform regex against an asset filename. Each pattern
          # captures the patch version (with leading "v") as group 1 and
          # accepts an optional .gz suffix (v0.77.3+ ships gzipped binaries;
          # the Dockerfile decompresses them). Windows -legacy and the
          # -sumo-musl variants are intentionally excluded.
          platform_regex() {
            local v='(v[0-9]+\.[0-9]+\.[0-9]+)'
            case "$1" in
              LINUX_AMD64)      echo "^velociraptor-${v}-linux-amd64(\\.gz)?\$" ;;
              LINUX_ARM64)      echo "^velociraptor-${v}-linux-arm64(\\.gz)?\$" ;;
              LINUX_AMD64_MUSL) echo "^velociraptor-${v}-linux-amd64-musl(\\.gz)?\$" ;;
              DARWIN_AMD64)     echo "^velociraptor-${v}-darwin-amd64(\\.gz)?\$" ;;
              DARWIN_ARM64)     echo "^velociraptor-${v}-darwin-arm64(\\.gz)?\$" ;;
              WINDOWS_EXE)      echo "^velociraptor-${v}-windows-amd64\\.exe(\\.gz)?\$" ;;
              WINDOWS_MSI)      echo "^velociraptor-${v}-windows-amd64\\.msi(\\.gz)?\$" ;;
            esac
          }

          # Pull the 10 most recent non-draft, non-prerelease releases.
          gh api -H "Accept: application/vnd.github+json" \
            "repos/${UPSTREAM_REPO}/releases?per_page=10" \
            --jq '[.[] | select(.draft==false and .prerelease==false)] | sort_by(.published_at) | reverse' \
            > releases.json

          # Flatten all assets across all those releases to
          # "name<TAB>url<TAB>digest" (digest is GitHub's "sha256:<hex>", may be empty).
          jq -r '.[] | .assets[] | "\(.name)\t\(.browser_download_url)\t\(.digest // "")"' \
            releases.json > all-assets.tsv

          declare -A VERSION URL SHA256 DIGEST

          for key in $ASSET_KEYS; do
            re="$(platform_regex "$key")"
            # Lines like "v0.76.5|<url>|<digest>". If a release carries both a
            # raw and a .gz copy, sort order makes the choice deterministic.
            candidates="$(
              while IFS=$'\t' read -r name url digest; do
                if [[ "$name" =~ $re ]]; then
                  printf '%s|%s|%s\n' "${BASH_REMATCH[1]}" "$url" "$digest"
                fi
              done < all-assets.tsv | sort -V -r
            )"
            if [ -z "$candidates" ]; then
              echo "FATAL: no matching asset found for $key across recent releases" >&2
              exit 1
            fi
            first="$(printf '%s\n' "$candidates" | head -n1)"
            IFS='|' read -r ver url digest <<< "$first"
            VERSION[$key]="$ver"
            URL[$key]="$url"
            DIGEST[$key]="${digest#sha256:}"
            echo "  $key -> $ver ($url)"
          done

          # Compute sha256s for each pinned asset. An asset whose URL and GitHub
          # digest match the current pin keeps its pinned sha256 (it was
          # downloaded and verified when it was pinned); anything new is
          # downloaded and checked against GitHub's digest.
          for key in $ASSET_KEYS; do
            pinned_url="$(sed -n "s/^${key}_URL=//p" binaries.lock)"
            pinned_sha="$(sed -n "s/^${key}_SHA256=//p" binaries.lock)"
            if [ "${URL[$key]}" = "$pinned_url" ] && [ -n "${DIGEST[$key]}" ] && [ "${DIGEST[$key]}" = "$pinned_sha" ]; then
              SHA256[$key]="$pinned_sha"
              continue
            fi
            tmp="$(mktemp)"
            curl -fsSL --retry 3 --retry-delay 2 -o "$tmp" "${URL[$key]}"
            SHA256[$key]="$(sha256sum "$tmp" | awk '{print $1}')"
            rm -f "$tmp"
            # Cross-check against the digest GitHub records for the asset.
            if [ -n "${DIGEST[$key]}" ] && [ "${DIGEST[$key]}" != "${SHA256[$key]}" ]; then
              echo "FATAL: $key download sha256 ${SHA256[$key]} != GitHub digest ${DIGEST[$key]}" >&2
              exit 1
            fi
          done

          # Pin generated Triage definitions to the immutable head commit of
          # the official gh-pages branch. This branch contains compiled YAMLs.
          TRIAGE_COMMIT="$(
            gh api -H "Accept: application/vnd.github+json" \
              "repos/${TRIAGE_REPO}/branches/gh-pages" --jq '.commit.sha'
          )"
          TRIAGE_BASE="https://raw.githubusercontent.com/${TRIAGE_REPO}/${TRIAGE_COMMIT}/docs"
          TRIAGE_LINUX_UAC_URL_NEW="${TRIAGE_BASE}/linux.triage.uac/Linux.Triage.UAC.yaml"
          TRIAGE_WINDOWS_TARGETS_URL_NEW="${TRIAGE_BASE}/windows.triage.targets/Windows.Triage.Targets.yaml"

          tmp="$(mktemp)"
          curl -fsSL --retry 3 --retry-delay 2 -o "$tmp" "$TRIAGE_LINUX_UAC_URL_NEW"
          TRIAGE_LINUX_UAC_SHA256="$(sha256sum "$tmp" | awk '{print $1}')"
          curl -fsSL --retry 3 --retry-delay 2 -o "$tmp" "$TRIAGE_WINDOWS_TARGETS_URL_NEW"
          TRIAGE_WINDOWS_TARGETS_SHA256="$(sha256sum "$tmp" | awk '{print $1}')"
          rm -f "$tmp"
          TRIAGE_LINUX_UAC_SHA256_NEW="$TRIAGE_LINUX_UAC_SHA256"
          TRIAGE_WINDOWS_TARGETS_SHA256_NEW="$TRIAGE_WINDOWS_TARGETS_SHA256"

          # Velocidex Sigma / Hayabusa pack: pin the zip at the gh-pages head.
          SIGMA_COMMIT="$(
            gh api -H "Accept: application/vnd.github+json" \
              "repos/${SIGMA_REPO}/branches/gh-pages" --jq '.commit.sha'
          )"
          SIGMA_ARTIFACTS_URL_NEW="https://raw.githubusercontent.com/${SIGMA_REPO}/${SIGMA_COMMIT}/artifacts/Velociraptor.Sigma.Artifacts.zip"
          curl -fsSL --retry 3 --retry-delay 2 -o sigma-new.zip "$SIGMA_ARTIFACTS_URL_NEW"
          SIGMA_ARTIFACTS_SHA256_NEW="$(sha256sum sigma-new.zip | awk '{print $1}')"

          # The image version is the server's version: both Linux server
          # binaries must be on the same patch. Until upstream has published
          # both, wait instead of building a mixed image.
          if [ "${VERSION[LINUX_AMD64]}" != "${VERSION[LINUX_ARM64]}" ]; then
            echo "::notice::Waiting for upstream: linux-amd64 is ${VERSION[LINUX_AMD64]}, linux-arm64 is ${VERSION[LINUX_ARM64]}."
            echo "wait=true" >> "$GITHUB_OUTPUT"
          fi
          NEW_VELOX_VERSION="${VERSION[LINUX_AMD64]}"
          echo "new_velox_version=${NEW_VELOX_VERSION}"
          echo "new_velox_version=${NEW_VELOX_VERSION}" >> "$GITHUB_OUTPUT"

          # Client assets behind the server version are allowed (upstream
          # sometimes never ships one), but only once the release is 48h old:
          # Velocidex often uploads some assets hours after publishing.
          LAGGING=""
          for key in $ASSET_KEYS; do
            if [ "${VERSION[$key]}" != "$NEW_VELOX_VERSION" ]; then
              echo "::warning::$key pinned to ${VERSION[$key]} (server version ${NEW_VELOX_VERSION})"
              LAGGING="${LAGGING}${key}=${VERSION[$key]} "
            fi
          done
          echo "lagging_assets=${LAGGING% }" >> "$GITHUB_OUTPUT"
          if [ -n "$LAGGING" ]; then
            published="$(jq -r --arg v "$NEW_VELOX_VERSION" \
              '[.[] | select(.assets[].name | startswith("velociraptor-" + $v + "-linux-amd64"))][0].published_at // empty' releases.json)"
            if [ -n "$published" ] && [ $(( $(date +%s) - $(date -d "$published" +%s) )) -lt 172800 ]; then
              echo "::notice::Release ${NEW_VELOX_VERSION} is less than 48h old and still missing assets; waiting."
              echo "wait=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Hash the bundled definitions without their generated build stamps
          # (Triage: "Commit <sha> on
          # <time>"), so a rebuild upstream that changes nothing else does not
          # cause an image revision.
          norm_sha() { curl -fsSL --retry 3 --retry-delay 2 "$1" | grep -vE '^[[:space:]]*Commit [0-9a-f]{7,40} on [0-9TZ:.-]+[[:space:]]*$' | sha256sum | awk '{print $1}'; }
          # Same for the bundled Sigma definitions ("This artifact was built on
          # <time>"); only the files we bundle are compared.
          norm_sigma() {
            local zip="$1" pair
            for pair in $SIGMA_ARTIFACTS; do
              unzip -p "$zip" "output/${pair%%:*}.yaml"
            done | grep -vE '^[[:space:]]*This artifact was built on ' | sha256sum | awk '{print $1}'
          }
          # shellcheck disable=SC1091
          . ./artifacts.lock
          curl -fsSL --retry 3 --retry-delay 2 -o sigma-old.zip "$SIGMA_ARTIFACTS_URL"
          if [ "$(norm_sha "$TRIAGE_LINUX_UAC_URL")" = "$(norm_sha "$TRIAGE_LINUX_UAC_URL_NEW")" ] && \
             [ "$(norm_sha "$TRIAGE_WINDOWS_TARGETS_URL")" = "$(norm_sha "$TRIAGE_WINDOWS_TARGETS_URL_NEW")" ] && \
             [ "$(norm_sigma sigma-old.zip)" = "$(norm_sigma sigma-new.zip)" ]; then
            echo "artifacts_content_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "artifacts_content_changed=true" >> "$GITHUB_OUTPUT"
          fi
          TRIAGE_LINUX_UAC_URL="$TRIAGE_LINUX_UAC_URL_NEW"
          TRIAGE_WINDOWS_TARGETS_URL="$TRIAGE_WINDOWS_TARGETS_URL_NEW"
          TRIAGE_LINUX_UAC_SHA256="$TRIAGE_LINUX_UAC_SHA256_NEW"
          TRIAGE_WINDOWS_TARGETS_SHA256="$TRIAGE_WINDOWS_TARGETS_SHA256_NEW"

          mkdir -p .upstream-check
          {
            echo "# Source of truth for the image build."
            echo "# Updated automatically by .github/workflows/upstream-check.yml (PR) and"
            echo "# read by .github/workflows/build-publish.yml."
            echo "#"
            echo "# VELOX_VERSION  = Velocidex patch version this image is built from"
            echo "#                  (filename component, e.g. v0.77.2). Exact per-asset"
            echo "#                  release URLs are recorded in binaries.lock."
            echo "# IMAGE_REVISION = our own re-release counter (bump when we fix something"
            echo "#                  on our side against the same upstream version)"
            echo "VELOX_VERSION=${NEW_VELOX_VERSION}"
            echo "IMAGE_REVISION=__IMAGE_REVISION__"
          } > .upstream-check/versions.env.new

          {
            echo "# Per-asset version pins. Managed by upstream-check.yml."
            echo "#"
            echo "# Each asset records the Velocidex patch version it should be pulled from"
            echo "# (e.g. v0.77.2), its exact API-provided URL, and expected sha256."
            echo "#"
            echo "# Normally every asset matches VELOX_VERSION in versions.env. When upstream"
            echo "# hasn't published a given platform for that patch yet, upstream-check walks"
            echo "# back through earlier patches (still inside the same minor release, or"
            echo "# earlier minor releases) and pins that asset to the most recent one that"
            echo "# does have it."
            echo "#"
            echo "# Format: <key>_VERSION=<patch-tag>, <key>_URL=<url>, <key>_SHA256=<hex>"
            echo "# URLs may end in .gz (v0.77.3+); SHA256 is of the downloaded file and the"
            echo "# Dockerfile decompresses after verifying it."
            echo "#"
            echo "# Keys: LINUX_AMD64, LINUX_ARM64, LINUX_AMD64_MUSL, DARWIN_AMD64, DARWIN_ARM64,"
            echo "#       WINDOWS_EXE, WINDOWS_MSI"
            echo ""
            for key in $ASSET_KEYS; do
              echo "${key}_VERSION=${VERSION[$key]}"
              echo "${key}_URL=${URL[$key]}"
              echo "${key}_SHA256=${SHA256[$key]}"
            done
          } > .upstream-check/binaries.lock.new

          {
            echo "# Bundled custom artifact pins. Managed by upstream-check.yml."
            echo "#"
            echo "# Generated definitions come from the official Velocidex Triage project's"
            echo "# GitHub Pages branch. URLs contain an immutable commit and every definition"
            echo "# is verified during the image build."
            echo ""
            echo "TRIAGE_SOURCE_COMMIT=${TRIAGE_COMMIT}"
            echo "TRIAGE_LINUX_UAC_URL=${TRIAGE_LINUX_UAC_URL}"
            echo "TRIAGE_LINUX_UAC_SHA256=${TRIAGE_LINUX_UAC_SHA256}"
            echo "TRIAGE_WINDOWS_TARGETS_URL=${TRIAGE_WINDOWS_TARGETS_URL}"
            echo "TRIAGE_WINDOWS_TARGETS_SHA256=${TRIAGE_WINDOWS_TARGETS_SHA256}"
            echo ""
            echo "# Velocidex Sigma / Hayabusa artifact pack (gh-pages build of"
            echo "# Velocidex/velociraptor-sigma-rules), pinned to an immutable commit. The"
            echo "# Dockerfile extracts the curated definitions listed in SIGMA_ARTIFACTS"
            echo "# (\"<file in the pack>:<artifact name>\"; edit this list to bundle more)."
            echo "SIGMA_ARTIFACTS=\"${SIGMA_ARTIFACTS}\""
            echo "SIGMA_SOURCE_COMMIT=${SIGMA_COMMIT}"
            echo "SIGMA_ARTIFACTS_URL=${SIGMA_ARTIFACTS_URL_NEW}"
            echo "SIGMA_ARTIFACTS_SHA256=${SIGMA_ARTIFACTS_SHA256_NEW}"
          } > .upstream-check/artifacts.lock.new
          rm -f sigma-old.zip sigma-new.zip

      - name: Compare against repo state and decide revision
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./versions.env
          OLD_VELOX_VERSION="${VELOX_VERSION}"
          OLD_IMAGE_REVISION="${IMAGE_REVISION}"

          NEW_VELOX_VERSION="${{ steps.resolve.outputs.new_velox_version }}"

          # Diff binaries.lock ignoring comments/whitespace.
          if diff -q \
              <(grep -vE '^\s*(#|$)' binaries.lock | sort) \
              <(grep -vE '^\s*(#|$)' .upstream-check/binaries.lock.new | sort) \
              >/dev/null; then
            BINARIES_CHANGED=false
          else
            BINARIES_CHANGED=true
          fi

          # Triage pins only matter when the definitions' content changed.
          if [ "${{ steps.resolve.outputs.artifacts_content_changed }}" != "true" ]; then
            cp artifacts.lock .upstream-check/artifacts.lock.new
          fi
          if diff -q \
              <(grep -vE '^\s*(#|$)' artifacts.lock | sort) \
              <(grep -vE '^\s*(#|$)' .upstream-check/artifacts.lock.new | sort) \
              >/dev/null; then
            ARTIFACTS_CHANGED=false
          else
            ARTIFACTS_CHANGED=true
          fi

          FORCE="${{ inputs.force_revision_bump }}"
          NEWEST="$(printf '%s\n%s\n' "$OLD_VELOX_VERSION" "$NEW_VELOX_VERSION" | sort -V | tail -n1)"

          if [ "${{ steps.resolve.outputs.wait }}" = "true" ]; then
            echo "Upstream release is incomplete; nothing to do yet."
            CHANGED=false
            NEW_IMAGE_REVISION="$OLD_IMAGE_REVISION"
            REASON=""
          elif [ "$OLD_VELOX_VERSION" != "$NEW_VELOX_VERSION" ] && [ "$NEWEST" = "$OLD_VELOX_VERSION" ] && [ "$FORCE" != "true" ]; then
            # A pulled/yanked upstream release would otherwise look like a bump.
            echo "::error::Upstream's newest server is ${NEW_VELOX_VERSION}, older than the pinned ${OLD_VELOX_VERSION}. Refusing to downgrade (re-run with force_revision_bump to override)."
            exit 1
          elif [ "$OLD_VELOX_VERSION" != "$NEW_VELOX_VERSION" ]; then
            REASON="upstream version bump: ${OLD_VELOX_VERSION} -> ${NEW_VELOX_VERSION}"
            NEW_IMAGE_REVISION=1
            CHANGED=true
          elif [ "$BINARIES_CHANGED" = "true" ] && [ "$ARTIFACTS_CHANGED" = "true" ]; then
            REASON="upstream re-published binaries and updated bundled artifacts for ${NEW_VELOX_VERSION}"
            NEW_IMAGE_REVISION=$(( OLD_IMAGE_REVISION + 1 ))
            CHANGED=true
          elif [ "$BINARIES_CHANGED" = "true" ]; then
            REASON="upstream re-published one or more binaries for ${NEW_VELOX_VERSION}"
            NEW_IMAGE_REVISION=$(( OLD_IMAGE_REVISION + 1 ))
            CHANGED=true
          elif [ "$ARTIFACTS_CHANGED" = "true" ]; then
            REASON="updated bundled Velocidex Triage / Sigma artifacts"
            NEW_IMAGE_REVISION=$(( OLD_IMAGE_REVISION + 1 ))
            CHANGED=true
          elif [ "$FORCE" = "true" ]; then
            REASON="manual force-bump"
            NEW_IMAGE_REVISION=$(( OLD_IMAGE_REVISION + 1 ))
            CHANGED=true
          else
            echo "Nothing changed; nothing to do."
            CHANGED=false
            NEW_IMAGE_REVISION="$OLD_IMAGE_REVISION"
            REASON=""
          fi

          sed -i "s/__IMAGE_REVISION__/${NEW_IMAGE_REVISION}/" .upstream-check/versions.env.new

          {
            echo "changed=${CHANGED}"
            echo "new_velox_version=${NEW_VELOX_VERSION}"
            echo "new_image_revision=${NEW_IMAGE_REVISION}"
            echo "reason=${REASON}"
          } >> "$GITHUB_OUTPUT"

      - name: Compare server configs (old vs new release)
        id: drift
        if: steps.decide.outputs.changed == 'true'
        run: |
          set -euo pipefail
          old_url="$(sed -n 's/^LINUX_AMD64_URL=//p' binaries.lock)"
          new_url="$(sed -n 's/^LINUX_AMD64_URL=//p' .upstream-check/binaries.lock.new)"
          rc=0
          if [ "$old_url" = "$new_url" ]; then
            echo "Server binary unchanged; no config comparison needed." > config-drift.md
          else
            scripts/config-drift.sh "$old_url" "$new_url" config-drift.md || rc=$?
          fi
          case "$rc" in
            0) labels="" ;;
            1) labels="config-changes" ;;
            *) labels="config-changes,config-incompatible"
               echo "::warning::The new release cannot load a config generated by the old one; see the PR." ;;
          esac
          cat config-drift.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo "labels=${labels}"
            echo "report<<DRIFT_EOF"
            cat config-drift.md
            echo "DRIFT_EOF"
          } >> "$GITHUB_OUTPUT"
          # Committed with the bump (docs/config-drift/<version>.md) so the
          # report is reviewed in the PR diff and kept in the history.
          mv config-drift.md .upstream-check/config-drift.md

      - name: Apply changes to repo
        if: steps.decide.outputs.changed == 'true'
        env:
          NEW_VELOX_VERSION: ${{ steps.decide.outputs.new_velox_version }}
        run: |
          set -euo pipefail
          mv .upstream-check/versions.env.new versions.env
          mv .upstream-check/binaries.lock.new binaries.lock
          mv .upstream-check/artifacts.lock.new artifacts.lock
          if [ -s .upstream-check/config-drift.md ]; then
            mkdir -p docs/config-drift
            mv .upstream-check/config-drift.md "docs/config-drift/${NEW_VELOX_VERSION}.md"
          fi
          rm -rf .upstream-check releases.json all-assets.tsv

      - name: Open or update the bump PR
        id: pr
        if: steps.decide.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # One branch for every bump: a newer upstream release updates the
          # open PR instead of leaving a superseded one behind.
          branch: upstream-check/bump
          commit-message: |
            chore(upstream): bump to ${{ steps.decide.outputs.new_velox_version }}-${{ steps.decide.outputs.new_image_revision }}

            ${{ steps.decide.outputs.reason }}
          title: "chore(upstream): bump to ${{ steps.decide.outputs.new_velox_version }}-${{ steps.decide.outputs.new_image_revision }}"
          body: |
            Automated upstream check.

            **Reason:** ${{ steps.decide.outputs.reason }}

            **Velociraptor version:** `${{ steps.decide.outputs.new_velox_version }}`
            **Image revision:** `${{ steps.decide.outputs.new_image_revision }}`
            **Assets pinned behind the server version:** `${{ steps.resolve.outputs.lagging_assets || 'none' }}`

            The build and full validation run as a `build-publish` dry run on this branch (see the Actions tab; PRs opened by GITHUB_TOKEN get no PR checks).
            Merging publishes automatically: `release-tag.yml` tags the merge commit and runs the release build.

            ${{ steps.drift.outputs.report }}

            (Also committed as `docs/config-drift/${{ steps.decide.outputs.new_velox_version }}.md`.)
          labels: ${{ steps.drift.outputs.labels }}
          delete-branch: true

      - name: Build and validate the bump branch
        id: dryrun
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run build-publish.yml --ref upstream-check/bump -f dry_run=true
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow build-publish.yml --branch upstream-check/bump \
              --event workflow_dispatch --limit 5 --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")][0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 10
          done
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          gh pr comment "$PR_URL" --body "Started a \`build-publish\` dry run on \`upstream-check/bump\` ($started): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}. Merge once it is green."

      # Near-real-time patching (repo variable AUTO_RELEASE_BUMPS=true): wait
      # for the dry run, then merge and release. Bumps whose new release can't
      # load an existing config (label config-incompatible) still wait for a
      # person. Merges made with GITHUB_TOKEN don't trigger workflows, so the
      # release is started explicitly.
      - name: Auto-release when the dry run passes
        if: vars.AUTO_RELEASE_BUMPS == 'true' && steps.dryrun.outputs.run_id != '' && !contains(steps.drift.outputs.labels, 'config-incompatible')
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          RUN_ID: ${{ steps.dryrun.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --interval 60 >/dev/null 2>&1 || true
          conclusion="$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)"
          if [ "$conclusion" != success ]; then
            gh pr comment "$PR_URL" --body "Auto-release skipped: the dry run ended with \`$conclusion\`."
            echo "::warning::Dry run $RUN_ID: $conclusion; leaving the bump PR for review."
            exit 0
          fi
          gh pr merge "$PR_URL" --merge
          gh workflow run release-tag.yml --ref main
          echo "### Auto-released: merged $PR_URL and started release-tag" >> "$GITHUB_STEP_SUMMARY"

      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling resets that timer.
      - name: Keep this schedule enabled
        if: always() && github.event_name == 'schedule'
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/upstream-check.yml/enable"

      - name: Report a failed check
        if: failure() && github.event_name == 'schedule'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="upstream-check is failing"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            # Hourly schedule: add at most one "still failing" comment a day.
            last="$(gh issue view "$existing" --json comments,createdAt --jq '(.comments | last | .createdAt) // .createdAt')"
            if [ $(( $(date +%s) - $(date -d "$last" +%s) )) -ge 86400 ]; then
              gh issue comment "$existing" --body "Still failing: $RUN_URL"
            fi
          else
            gh issue create --title "$title" --body "The scheduled upstream check failed: $RUN_URL"
          fi
