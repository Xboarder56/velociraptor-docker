name: build-publish

# Builds natively on amd64 and arm64 runners and runs the full validation on
# both. Publishing pushes each architecture by digest, validates the pushed
# image itself, and only then creates the multi-arch tags.
#
#   pull_request / push to main  build + validate (main also warms the cache)
#   push of a v* tag               build + validate + publish
#   workflow_dispatch              build + validate; publishes only when
#                                  dry_run is unchecked AND the ref is main
#                                  or a v* tag (release-tag.yml uses this)
#   workflow_dispatch + rehearsal  the full publish path on main, but the only
#                                  tag written is :rehearsal (release-tag.yml
#                                  `rehearsal` runs this after a tag-push test)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + validate only, do not push"
        type: boolean
        default: true
      rehearsal:
        description: "Run the whole publish path but only write the :rehearsal tag (main only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: docker.io/xboarder56/velociraptor
  # Previously published images the upgrade test starts from (multi-arch).
  LEGACY_IMAGES: >-
    docker.io/xboarder56/velociraptor:0.76.5@sha256:1f7d6a4b3785d5ec5e2b49b83029612f12181bdd410e00f17d120bccda84dfe6
    docker.io/xboarder56/velociraptor:0.77.2@sha256:231bb2e69458fc5990557c0d713a2f1a8a29d2dcedc54da55a9394e699e4af8d
    docker.io/xboarder56/velociraptor:0.77.3-4@sha256:967ad03dbb605da373d0f8b62d33054eeffc8b6d5fd207730abf0ad58ab0fee4

jobs:
  # Cheap checks first: a syntax error in a test script must never reach a
  # release (the release build runs the same scripts).
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax and shellcheck
        run: |
          set -euo pipefail
          for f in entrypoint healthcheck scripts/*.sh; do bash -n "$f" 2>/dev/null || sh -n "$f"; done
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -x -e SC2016 entrypoint healthcheck scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile artifacts-sync && rm -rf __pycache__
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -no-color

  prepare:
    needs: lint
    runs-on: ubuntu-24.04
    outputs:
      build_args: ${{ steps.vars.outputs.build_args }}
      velox_version: ${{ steps.vars.outputs.velox_version }}
      tags: ${{ steps.plan.outputs.tags }}
      publish: ${{ steps.plan.outputs.publish }}
      base_image: ${{ steps.vars.outputs.base_image }}
      base_digest: ${{ steps.vars.outputs.base_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions.env and lockfiles
        id: vars
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./versions.env
          base_image="$(awk '/^FROM /{print $2; exit}' Dockerfile)"
          {
            echo "velox_version=${VELOX_VERSION}"
            echo "image_revision=${IMAGE_REVISION}"
            echo "base_image=${base_image%@*}"
            echo "base_digest=${base_image#*@}"
            echo "build_args<<EOF"
            scripts/build-args.sh
            echo "GIT_COMMIT=${GITHUB_SHA::7}"
            # Last in the Dockerfile, so a new date never invalidates the cache.
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish, and the tags
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REHEARSAL: ${{ inputs.rehearsal }}
          VELOX_VERSION: ${{ steps.vars.outputs.velox_version }}
          IMAGE_REVISION: ${{ steps.vars.outputs.image_revision }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$REHEARSAL" = "true" ]; then
            if [ "$EVENT" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::A rehearsal runs from main via workflow_dispatch (got $EVENT on $GITHUB_REF)."
              exit 1
            fi
            DRY_RUN=false
          fi
          case "$EVENT" in
            push)
              [[ "$GITHUB_REF" == refs/tags/* ]] && publish=true ;;
            workflow_dispatch)
              if [ "$DRY_RUN" != "true" ]; then
                case "$GITHUB_REF" in
                  refs/heads/main|refs/tags/v*) publish=true ;;
                  *)
                    echo "::error::Publishing is only allowed from main or a v* tag (got $GITHUB_REF). Re-run with dry_run checked."
                    exit 1 ;;
                esac
              fi ;;
          esac

          bare="${VELOX_VERSION#v}"
          minor="$(cut -d. -f1,2 <<< "$bare")"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            # v<version> is revision 1; later revisions are v<version>-<rev>.
            if [ "$tag" != "${VELOX_VERSION}-${IMAGE_REVISION}" ] && \
               { [ "$tag" != "$VELOX_VERSION" ] || [ "$IMAGE_REVISION" != 1 ]; }; then
              echo "::error::Tag '$tag' does not match versions.env (${VELOX_VERSION}, revision ${IMAGE_REVISION})."
              exit 1
            fi
          fi

          # Moving tags only move forward: `latest` when this is the newest
          # Velociraptor version released here, the minor tag when it is the
          # newest of its minor line.
          # Ask the remote (a tag checkout already has its own tag locally,
          # and `git fetch --tags` refuses to touch it).
          released="$(git ls-remote --tags --refs origin 'v[0-9]*' \
            | sed -E 's#.*refs/tags/v##; s/-[0-9]+$//' | sort -uV)"
          newest="$(printf '%s\n%s\n' "$released" "$bare" | sed '/^$/d' | sort -V | tail -n1)"
          newest_minor="$(printf '%s\n%s\n' "$released" "$bare" | grep -E "^${minor//./\\.}\." | sort -V | tail -n1)"

          tags=(
            "${IMAGE}:${bare}"
            "${IMAGE}:${bare}-${IMAGE_REVISION}"
            "${IMAGE}:sha-${GITHUB_SHA::7}"
          )
          if [ "$bare" = "$newest_minor" ]; then tags+=("${IMAGE}:${minor}"); fi
          if [ "$bare" = "$newest" ]; then tags+=("${IMAGE}:latest"); fi
          if [ "$REHEARSAL" = "true" ]; then
            # Exercise everything, touch nothing users pull.
            tags=("${IMAGE}:rehearsal")
          fi

          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo "- Publish: \`${publish}\`"
            echo "- Tags: \`${tags[*]}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Build and validate ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Velociraptor
            org.opencontainers.image.description=Velociraptor (Velocidex) server in a Docker container with prebuilt client repacks
            org.opencontainers.image.version=${{ needs.prepare.outputs.velox_version }}
            org.opencontainers.image.documentation=https://github.com/Xboarder56/velociraptor-docker#readme
            org.opencontainers.image.vendor=Xboarder56
            org.opencontainers.image.authors=Xboarder56 <https://github.com/Xboarder56>
            org.opencontainers.image.base.name=${{ needs.prepare.outputs.base_image }}
            org.opencontainers.image.base.digest=${{ needs.prepare.outputs.base_digest }}

      - name: Build for validation
        if: needs.prepare.outputs.publish != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: velociraptor:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=gha,scope=velociraptor-${{ matrix.arch }}
          cache-to: type=gha,scope=velociraptor-${{ matrix.arch }},mode=max

      - name: Build and push by digest
        id: push
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ needs.prepare.outputs.build_args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=velociraptor-${{ matrix.arch }}
          cache-to: type=gha,scope=velociraptor-${{ matrix.arch }},mode=max

      - name: Pull the pushed image for validation
        if: needs.prepare.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" velociraptor:smoke

      - name: Validate image (server, GUI/API, artifacts, bundles, enrollment, collection)
        env:
          IMAGE: velociraptor:smoke
          CLIENT_ARCH: ${{ matrix.arch }}
        run: ./scripts/ci-image-validation.sh

      - name: Validate config modes, secrets and upgrades from published images
        env:
          IMAGE: velociraptor:smoke
        run: ./scripts/ci-config-modes-validation.sh

      - name: Record digest
        if: needs.prepare.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # The same end-to-end validation under rootless Podman (the runner's
  # preinstalled podman, with `docker` pointed at it).
  podman:
    needs: prepare
    if: needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    name: Validate under rootless Podman (amd64)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: velociraptor:smoke
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=gha,scope=velociraptor-amd64

      - name: Hand the image to rootless Podman
        run: |
          set -euo pipefail
          podman --version
          docker save velociraptor:smoke -o "$RUNNER_TEMP/smoke.tar"
          loaded="$(podman load -i "$RUNNER_TEMP/smoke.tar" | sed -n 's/^Loaded image: //p' | head -n1)"
          podman tag "$loaded" localhost/velociraptor:smoke
          rm -f "$RUNNER_TEMP/smoke.tar"
          podman image exists localhost/velociraptor:smoke

      - name: Validate image under Podman
        env:
          IMAGE: localhost/velociraptor:smoke
          CLIENT_ARCH: amd64
          CONTAINER_RUNTIME: podman
        run: |
          # `docker` is podman for this step only (later steps still need Docker).
          mkdir -p "$RUNNER_TEMP/podman-bin"
          ln -sf "$(command -v podman)" "$RUNNER_TEMP/podman-bin/docker"
          export PATH="$RUNNER_TEMP/podman-bin:$PATH"
          docker --version
          ./scripts/ci-image-validation.sh

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # One publish at a time, never cancelled half-way: moving tags are only
    # ever written by one run.
    concurrency:
      group: velociraptor-publish
      cancel-in-progress: false
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch tags from the validated digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          sources=()
          for f in digests/*; do sources+=("${IMAGE}@sha256:$(basename "$f")"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "expected 2 digests, got ${#sources[@]}" >&2; exit 1; }
          tag_args=()
          for t in $TAGS; do tag_args+=(-t "$t"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify published tags
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          first=""
          for t in $TAGS; do
            digest="$(docker buildx imagetools inspect "$t" --format '{{.Manifest.Digest}}')"
            arches="$(docker buildx imagetools inspect "$t" --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}')"
            echo "$t $digest $arches"
            [[ "$arches" == *amd64* && "$arches" == *arm64* ]] || { echo "$t is missing an architecture" >&2; exit 1; }
            [ -z "$first" ] && first="$digest"
            [ "$digest" = "$first" ] || { echo "$t points at a different digest" >&2; exit 1; }
          done
          echo "### Published \`$first\`" >> "$GITHUB_STEP_SUMMARY"
          for t in $TAGS; do echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"; done
