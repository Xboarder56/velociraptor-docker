name: release-tag

# Publishes every merged release: when versions.env changes on main (an
# upstream bump, or an IMAGE_REVISION bump for our own fixes), tag the merge
# commit and run the release build for that tag.
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the build
# is started explicitly with workflow_dispatch (which GITHUB_TOKEN may do).

on:
  push:
    branches:
      - main
    paths:
      - versions.env
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "Test the release path: push and delete a throwaway tag, then run build-publish in rehearsal mode (only :rehearsal is published)"
        type: boolean
        default: false

permissions:
  contents: write   # push the release tag
  actions: write    # start build-publish for it

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rehearse the release path
        if: inputs.rehearsal
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Rehearse from main."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="rehearsal-${GITHUB_RUN_ID}"
          git tag -a "$tag" -m "Release rehearsal (deleted right away)" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          git push origin ":refs/tags/$tag"
          echo "Tag push and delete with the workflow token: OK"
          gh workflow run build-publish.yml --ref main -f dry_run=false -f rehearsal=true
          echo "### Rehearsal: tag push OK, build-publish (rehearsal) started" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and publish
        if: ${{ !inputs.rehearsal }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./versions.env
          if ! [[ "$VELOX_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$IMAGE_REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Unexpected versions.env contents: VELOX_VERSION=$VELOX_VERSION IMAGE_REVISION=$IMAGE_REVISION"
            exit 1
          fi
          if [ "$IMAGE_REVISION" = 1 ]; then
            tag="$VELOX_VERSION"
          else
            tag="${VELOX_VERSION}-${IMAGE_REVISION}"
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA" ]; then
              echo "Tag $tag already points at this commit; (re)starting its build."
            else
              echo "::notice::Tag $tag already exists on another commit; nothing to publish. Bump IMAGE_REVISION to release this commit."
              exit 0
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

          gh workflow run build-publish.yml --ref "$tag" -f dry_run=false
          echo "### Released \`$tag\` — build-publish started" >> "$GITHUB_STEP_SUMMARY"
