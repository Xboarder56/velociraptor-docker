version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The Dockerfile's base image (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
